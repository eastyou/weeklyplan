name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test weekly plan generation
        run: |
          python -m weeklyplan -i examples/任务.csv --start 2026-11-23 -o plan.html
          python -m weeklyplan --rows 6 -o blank.html
          python -c "print(open('plan.html', encoding='utf-8').read().count('class=' + chr(34) + 'box' + chr(34)))"
          python -c "print(open('plan.html', encoding='utf-8').read().count('11/23'))"
          python -c "print(open('blank.html', encoding='utf-8').read().count('A4 portrait'))"
